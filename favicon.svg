<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182E" />
      <stop offset="100%" stop-color="#0E2C52" />
    </linearGradient>

    <!-- Sovereign Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE68A" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Crest Shield -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#C59B27" stroke-width="6" stroke-opacity="0.4" />

  <!-- Classical Academic Laurel & Shield Geometry -->
  <g filter="url(#softGlow)">
    <!-- Mortarboard / Academic Cap Apex -->
    <path d="M256 104 L108 174 L256 244 L404 174 Z" fill="url(#goldGrad)" />
    
    <!-- Central Sovereign Keystone Pillar -->
    <path d="M148 214 V318 C148 376 256 420 256 420 C256 420 364 376 364 318 V214 L256 264 Z" fill="url(#goldGrad)" opacity="0.94" />

    <!-- Core Inner Axis & Star of Academic Rigor -->
    <line x1="256" y1="104" x2="256" y2="420" stroke="#FAF8F5" stroke-width="12" stroke-linecap="round" />
    <circle cx="256" cy="94" r="16" fill="#FAF8F5" />

    <!-- Side Architectural Balance Lines -->
    <path d="M196 270 V346" stroke="#FAF8F5" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <path d="M316 270 V346" stroke="#FAF8F5" stroke-width="6" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
